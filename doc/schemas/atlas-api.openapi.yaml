openapi: 3.0.3
info:
  title: ATLAS Knowledge Management API
  description: |
    API specification for the ATLAS (Adaptive Thinking and Learning Architecture System) 
    knowledge management framework. This specification describes the core operations
    for managing entities, patterns, queries, and system configuration.
  version: 1.0.0
  contact:
    name: ATLAS Development Team
    url: https://github.com/atlas-team/atlas
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.atlas-knowledge.org/v1
    description: Production server

paths:
  /entities:
    get:
      summary: List entities
      description: Retrieve a list of entities with optional filtering
      parameters:
        - name: pattern
          in: query
          description: Filter by pattern ID
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of entities
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entity'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
    post:
      summary: Create entity
      description: Create a new entity in the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreate'
      responses:
        '201':
          description: Entity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          description: Invalid entity data
        '409':
          description: Entity already exists

  /entities/{entityId}:
    get:
      summary: Get entity
      description: Retrieve a specific entity by ID
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '404':
          description: Entity not found
    put:
      summary: Update entity
      description: Update an existing entity
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityUpdate'
      responses:
        '200':
          description: Entity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '404':
          description: Entity not found
    delete:
      summary: Delete entity
      description: Remove an entity from the system
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Entity deleted successfully
        '404':
          description: Entity not found

  /patterns:
    get:
      summary: List patterns
      description: Retrieve a list of patterns with optional filtering
      parameters:
        - name: parent
          in: query
          description: Filter by parent pattern ID
          schema:
            type: string
        - name: domain
          in: query
          description: Filter by domain
          schema:
            type: string
      responses:
        '200':
          description: List of patterns
          content:
            application/json:
              schema:
                type: object
                properties:
                  patterns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pattern'
    post:
      summary: Create pattern
      description: Create a new pattern in the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatternCreate'
      responses:
        '201':
          description: Pattern created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pattern'

  /patterns/{patternId}:
    get:
      summary: Get pattern
      description: Retrieve a specific pattern by ID
      parameters:
        - name: patternId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pattern details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pattern'
        '404':
          description: Pattern not found

  /patterns/{patternId}/similarity:
    get:
      summary: Calculate pattern similarity
      description: Calculate similarity between patterns
      parameters:
        - name: patternId
          in: path
          required: true
          schema:
            type: string
        - name: compareWith
          in: query
          required: true
          description: Pattern ID to compare with
          schema:
            type: string
      responses:
        '200':
          description: Similarity score
          content:
            application/json:
              schema:
                type: object
                properties:
                  similarity:
                    type: number
                    minimum: 0
                    maximum: 1
                  pattern1:
                    type: string
                  pattern2:
                    type: string

  /queries:
    get:
      summary: List queries
      description: Retrieve a list of iQueries
      responses:
        '200':
          description: List of queries
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Query'
    post:
      summary: Create query
      description: Create and execute a new iQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryCreate'
      responses:
        '201':
          description: Query created and executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'

  /search:
    get:
      summary: Search entities
      description: Perform text-based search across entities
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
        - name: patterns
          in: query
          description: Comma-separated list of pattern IDs to search within
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  query:
                    type: string
                  total:
                    type: integer

  /system/metrics:
    get:
      summary: Get system metrics
      description: Retrieve system performance and usage metrics
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetrics'

  /system/export:
    post:
      summary: Export data
      description: Export system data in various formats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [json, graphml, yaml]
                include_metadata:
                  type: boolean
                  default: true
                entities:
                  type: array
                  items:
                    type: string
                  description: Specific entity IDs to export (optional)
      responses:
        '200':
          description: Exported data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  schemas:
    Entity:
      type: object
      properties:
        id:
          type: string
          description: Unique entity identifier
        attributes:
          type: object
          additionalProperties: true
          description: Key-value pairs of entity attributes
        patterns:
          type: array
          items:
            type: string
          description: List of pattern IDs this entity conforms to
        metadata:
          $ref: '#/components/schemas/EntityMetadata'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id

    EntityCreate:
      type: object
      properties:
        id:
          type: string
          description: Unique entity identifier
        attributes:
          type: object
          additionalProperties: true
          description: Key-value pairs of entity attributes
        patterns:
          type: array
          items:
            type: string
          description: List of pattern IDs this entity conforms to
      required:
        - id

    EntityUpdate:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: true
          description: Key-value pairs of entity attributes
        patterns:
          type: array
          items:
            type: string
          description: List of pattern IDs this entity conforms to

    EntityMetadata:
      type: object
      properties:
        source:
          type: string
          description: Source of the entity data
        quality_score:
          type: number
          minimum: 0
          maximum: 1
          description: Quality assessment score
        version:
          type: integer
          description: Version number
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence in the data

    Pattern:
      type: object
      properties:
        id:
          type: string
          description: Unique pattern identifier
        qkit:
          type: array
          items:
            type: string
          description: Question kit - list of expected questions
        parents:
          type: array
          items:
            type: string
          description: Parent pattern IDs
        children:
          type: array
          items:
            type: string
          description: Child pattern IDs
        attributes:
          type: object
          additionalProperties: true
          description: Pattern attributes and metadata
        effectiveness_score:
          type: number
          minimum: 0
          maximum: 1
          description: Calculated effectiveness score
      required:
        - id

    PatternCreate:
      type: object
      properties:
        id:
          type: string
          description: Unique pattern identifier
        qkit:
          type: array
          items:
            type: string
          description: Question kit - list of expected questions
        parents:
          type: array
          items:
            type: string
          description: Parent pattern IDs
        attributes:
          type: object
          additionalProperties: true
          description: Pattern attributes and metadata
      required:
        - id

    Query:
      type: object
      properties:
        id:
          type: string
          description: Unique query identifier
        query_text:
          type: string
          description: The query text or question
        target_patterns:
          type: array
          items:
            type: string
          description: Pattern IDs to target
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
          description: Query execution priority
        status:
          type: string
          enum: [PENDING, EXECUTING, COMPLETED, FAILED, CANCELLED]
          description: Query execution status
        context:
          type: object
          additionalProperties: true
          description: Additional context for query execution
      required:
        - id
        - query_text

    QueryCreate:
      type: object
      properties:
        id:
          type: string
          description: Unique query identifier
        query_text:
          type: string
          description: The query text or question
        target_patterns:
          type: array
          items:
            type: string
          description: Pattern IDs to target
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
          default: NORMAL
          description: Query execution priority
        context:
          type: object
          additionalProperties: true
          description: Additional context for query execution
      required:
        - query_text

    QueryResult:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/Query'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        execution_time:
          type: number
          description: Query execution time in seconds
        quality_score:
          type: number
          minimum: 0
          maximum: 1
          description: Overall quality score of results

    SearchResult:
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/Entity'
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Relevance score
        matches:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              text:
                type: string
              score:
                type: number

    SystemMetrics:
      type: object
      properties:
        entities_created:
          type: integer
          description: Total number of entities
        patterns_created:
          type: integer
          description: Total number of patterns
        queries_executed:
          type: integer
          description: Total number of queries executed
        relationships_added:
          type: integer
          description: Total number of relationships
        graph_density:
          type: number
          description: Graph density metric
        total_nodes:
          type: integer
          description: Total nodes in graph
        total_edges:
          type: integer
          description: Total edges in graph
        system_uptime:
          type: number
          description: System uptime in seconds
        memory_usage:
          type: object
          properties:
            total:
              type: integer
            used:
              type: integer
            available:
              type: integer

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: entities
    description: Entity management operations
  - name: patterns
    description: Pattern management operations
  - name: queries
    description: Query and search operations
  - name: system
    description: System administration operations 